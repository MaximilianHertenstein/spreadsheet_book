answer.answer = """`ANZAHL` liefert `3` und `ANZAHL2` liefert `5`."""
context = """`ANZAHL` zählt nur Zahlen, also 3. `ANZAHL2` zählt alle nicht leeren Zellen, also 3 Zahlen plus 2 Texte gleich 5. Wer beide gleichsetzt, hat den Unterschied zwischen Zahlen zählen und Zellen zählen übersehen."""
