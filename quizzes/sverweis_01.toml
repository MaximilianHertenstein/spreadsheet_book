answer.answer = """In der ersten Spalte des Bereichs, also in `A2:A6`."""
context = """`SVERWEIS` sucht immer nur in der ersten Spalte des angegebenen Bereichs. Die erste Zeile enthält meist Überschriften und wird nicht als Suchspalte behandelt. Die hinteren Spalten liefern später das Ergebnis, gesucht wird dort nicht."""
